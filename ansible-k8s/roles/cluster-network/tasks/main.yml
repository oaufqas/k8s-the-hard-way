---
- name: Cluster network setting up..
  delegate_to: localhost
  run_once: true
  block:
  
  - name: Checking a local directory for manifests..
    file:
      path: "{{ manifestdir }}"
      state: directory


  - name: Getting facts..
    setup:
      gather_subset: env
    register: facts
    

  - name: Determining the actual user and their home directory
    set_fact:
      home_dir: "{{ ansible_facts['env']['HOME'] | default('/root') if (ansible_facts['env']['SUDO_USER'] is not defined) else '/home/' ~ ansible_facts['env']['SUDO_USER'] }}"


  - name: Checking a local directory for kubeconfig..
    file:
      path: "{{ home_dir }}/.kube"
      state: directory


  - name: Deleting file /.kube/config..
    file: 
      path: "{{ home_dir }}/.kube/config"
      state: absent


  - name: Сopying manifest and configuration files..
    copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
    loop:
      - { src: 'kube-apiserver-to-kubelet.yaml', dest: "{{ manifestdir }}/" }
      - { src: "{{ kubecfgdir }}/admin.kubeconfig", dest: "{{ home_dir }}/.kube/config" }


  - name: Generation manifest files..
    template:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
    loop:
      - { src: 'coredns.yaml.j2', dest: "{{ manifestdir }}/coredns.yaml" }
      - { src: 'calico.yaml.j2', dest: "{{ manifestdir }}/calico.yaml" }


  - name: Verifying the python3-kubernetes installation..
    apt:
      name: 
        - python3-kubernetes
      state: present
      update_cache: yes


  - name: Applying manifests to a kubernetes cluster..
    kubernetes.core.k8s:
      src: "{{ manifestdir }}/{{ item }}"
      state: present
    loop:
      - 'kube-apiserver-to-kubelet.yaml'
      - 'calico.yaml'
      - 'coredns.yaml'